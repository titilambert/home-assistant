syntax = "proto3";

package homeassistant.core;

service CoreService {
  rpc SetState(SetStateRequest) returns (SetStateResponse);
  rpc GetState(GetStateRequest) returns (GetStateResponse);
  rpc RegisterService(RegisterServiceRequest) returns (RegisterServiceResponse);
  rpc CallServiceOnRemote(CallServiceOnRemoteRequest) returns (CallServiceOnRemoteResponse);
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc GetTranslations(GetTranslationsRequest) returns (GetTranslationsResponse);
}

service WorkerService {
  rpc CallService(WorkerCallServiceRequest) returns (WorkerCallServiceResponse);
  rpc SetupEntry(WorkerSetupEntryRequest) returns (WorkerSetupEntryResponse);
  rpc TeardownEntry(WorkerTeardownEntryRequest) returns (WorkerTeardownEntryResponse);
}

message SetStateRequest {
  string entity_id = 1;
  string state = 2;
  map<string, string> attributes = 3;
  string entry_id = 4;
}

message SetStateResponse {
  bool success = 1;
  string error = 2;
}

message GetStateRequest {
  string entity_id = 1;
}

message GetStateResponse {
  bool found = 1;
  string entity_id = 2;
  string state = 3;
  map<string, string> attributes = 4;
  int64 last_updated = 5;
}

message RegisterServiceRequest {
  string domain = 1;
  string service = 2;
  string entry_id = 3;
}

message RegisterServiceResponse {
  bool success = 1;
  string error = 2;
}

message CallServiceOnRemoteRequest {
  string domain = 1;
  string service = 2;
  string entity_id = 3;
  map<string, string> service_data = 4;
}

message CallServiceOnRemoteResponse {
  bool success = 1;
  string error = 2;
}

message RegisterWorkerRequest {
  string entry_id = 1;
  string worker_address = 2;
}

message RegisterWorkerResponse {
  bool success = 1;
  string error = 2;
}

message GetEntryRequest {
  string entry_id = 1;
}

message GetEntryResponse {
  bool found = 1;
  string domain = 2;
  bytes config = 3;   // JSON-serialized entry.data
  bytes options = 4;  // JSON-serialized entry.options
  string title = 5;
  string source = 6;  // "builtin", "github:user/repo@ref", "hacs:domain"
}

message GetConfigRequest {}

message GetConfigResponse {
  string time_zone = 1;
  string unit_system = 2;        // "metric" ou "us_customary"
  string language = 3;
  double latitude = 4;
  double longitude = 5;
  string country = 6;
  string currency = 7;
  string temperature_unit = 8;   // "°C" ou "°F"
  string length_unit = 9;
  string mass_unit = 10;
  string pressure_unit = 11;
  string volume_unit = 12;
  string wind_speed_unit = 13;
  string accumulated_precipitation_unit = 14;
}

message GetTranslationsRequest {
  string language = 1;     // e.g. "fr", "en"
  string category = 2;     // e.g. "entity"
  string integration = 3;  // e.g. "environment_canada"
}

message GetTranslationsResponse {
  map<string, string> translations = 1;
  // Key: full translation key e.g. "component.environment_canada.entity.sensor.temperature.name"
  // Value: translated string e.g. "Température"
}

message WorkerCallServiceRequest {
  string domain = 1;
  string service = 2;
  string entity_id = 3;
  map<string, string> service_data = 4;
}

message WorkerCallServiceResponse {
  bool success = 1;
  string error = 2;
}

message WorkerSetupEntryRequest {
  string entry_id = 1;
}

message WorkerSetupEntryResponse {
  bool success = 1;
  string error = 2;
}

message WorkerTeardownEntryRequest {
  string entry_id = 1;
}

message WorkerTeardownEntryResponse {
  bool success = 1;
  string error = 2;
}
